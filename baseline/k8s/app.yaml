apiVersion: apps/v1
kind: Deployment
metadata:
  name: baseline-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: baseline-app
  template:
    metadata:
      labels:
        app: baseline-app
    spec:
      containers:
        - name: app
          image: baseline-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: baseline-app
spec:
  selector:
    app: baseline-app
  ports:
    - port: 80
      targetPort: 3000