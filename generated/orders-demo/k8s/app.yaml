apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-demo
  template:
    metadata:
      labels:
        app: orders-demo
    spec:
      containers:
        - name: app
          image: orders-demo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: orders-demo
spec:
  selector:
    app: orders-demo
  ports:
    - port: 80
      targetPort: 3000
